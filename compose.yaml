services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recon
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - recon-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U recon -d recon"]
      interval: 2s
      timeout: 5s
      retries: 20
  metrics:
    build: .
    command: [python, -m, recon_engine.metrics, --file, /app/reports/metrics.prom, --bind, 0.0.0.0]
    volumes:
      - recon-reports:/app/reports:ro
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [metrics]
  batch:
    build: .
    environment:
      DATABASE_URL: postgresql://recon:local-demo-only@postgres:5432/recon
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/output:/input:ro
      - recon-reports:/app/reports
    command: [python, -m, recon_engine.batch, --data-dir, /input, --output-dir, /app/reports, --run-id, demo-v1]
volumes:
  recon-db:
  recon-reports:
