name: Publish verified Recon candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recon-publish
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: recon-release
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: recon-portfolio
      ARTIFACT_BUCKET: ${{ vars.RECON_ARTIFACT_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.RECON_PUBLISHER_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable commit tag
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: python scripts/publish_image.py
      - name: Publish synthetic inputs and candidate manifest
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: python scripts/publish_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: candidate.json
