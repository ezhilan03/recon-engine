[project]
name = "recon-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.9",
    "langgraph-checkpoint>=4.1",
    "langgraph-checkpoint-postgres>=3.0",
    "litellm>=1.93.0",
    "mcp[cli]==2.0.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_engine"]
